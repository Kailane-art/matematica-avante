<script>
(function () {
    const conteudos = [{"id":"angulos","activityType":"trig_angulos","titulo":"Ângulos e medidas","icone":"angle","descricao":"Reconheça ângulos, seus elementos e as unidades usadas para medir sua abertura.","questoes":[{"pergunta":"Um ângulo é formado por:","opcoes":{"a":"Duas semirretas com a mesma origem","b":"Duas retas paralelas","c":"Três segmentos sem ligação"}},{"pergunta":"Um ângulo reto mede:","opcoes":{"a":"45°","b":"90°","c":"180°"}},{"pergunta":"Um ângulo raso mede:","opcoes":{"a":"90°","b":"120°","c":"180°"}},{"pergunta":"Um ângulo de 35° é:","opcoes":{"a":"Agudo","b":"Reto","c":"Obtuso"}},{"pergunta":"Um ângulo de 120° é:","opcoes":{"a":"Agudo","b":"Obtuso","c":"Raso"}}]},{"id":"graus-radianos","activityType":"trig_graus_radianos","titulo":"Graus e radianos","icone":"ruler","descricao":"Converta medidas angulares entre graus e radianos.","questoes":[{"pergunta":"Uma volta completa corresponde a:","opcoes":{"a":"90° ou π/2 rad","b":"180° ou π rad","c":"360° ou 2π rad"}},{"pergunta":"180° equivalem a:","opcoes":{"a":"π rad","b":"π/2 rad","c":"2π rad"}},{"pergunta":"90° equivalem a:","opcoes":{"a":"π rad","b":"π/2 rad","c":"2π rad"}},{"pergunta":"π/3 rad equivalem a:","opcoes":{"a":"30°","b":"60°","c":"120°"}},{"pergunta":"π/4 rad equivalem a:","opcoes":{"a":"45°","b":"60°","c":"90°"}}]},{"id":"triangulo-retangulo","activityType":"trig_triangulo_retangulo","titulo":"Triângulo retângulo","icone":"triangle-right","descricao":"Identifique hipotenusa e catetos em um triângulo retângulo.","questoes":[{"pergunta":"Um triângulo retângulo possui um ângulo de:","opcoes":{"a":"45°","b":"90°","c":"180°"}},{"pergunta":"O lado oposto ao ângulo reto é chamado de:","opcoes":{"a":"Hipotenusa","b":"Cateto adjacente","c":"Mediana"}},{"pergunta":"Em relação a um ângulo agudo, o cateto adjacente é:","opcoes":{"a":"O lado que forma o ângulo junto com a hipotenusa","b":"O lado oposto ao ângulo","c":"Sempre a hipotenusa"}},{"pergunta":"Em um triângulo retângulo com catetos 3 e 4, a hipotenusa mede:","opcoes":{"a":"5","b":"6","c":"7"}},{"pergunta":"O Teorema de Pitágoras afirma que:","opcoes":{"a":"a + b = c","b":"a² + b² = c²","c":"a² − b² = c²"}}]},{"id":"razoes","activityType":"trig_razoes","titulo":"Razões trigonométricas","icone":"calculator","descricao":"Entenda seno, cosseno e tangente como relações entre os lados de um triângulo retângulo.","questoes":[{"pergunta":"O seno de um ângulo é a razão entre:","opcoes":{"a":"Cateto oposto e hipotenusa","b":"Cateto adjacente e hipotenusa","c":"Cateto oposto e adjacente"}},{"pergunta":"O cosseno de um ângulo é a razão entre:","opcoes":{"a":"Cateto oposto e hipotenusa","b":"Cateto adjacente e hipotenusa","c":"Hipotenusa e cateto adjacente"}},{"pergunta":"A tangente de um ângulo é a razão entre:","opcoes":{"a":"Hipotenusa e cateto oposto","b":"Cateto adjacente e hipotenusa","c":"Cateto oposto e cateto adjacente"}},{"pergunta":"Em um triângulo 3-4-5, se o cateto oposto é 3 e a hipotenusa é 5, o seno é:","opcoes":{"a":"3/5","b":"4/5","c":"5/3"}},{"pergunta":"Em um triângulo 3-4-5, se o cateto adjacente é 4 e a hipotenusa é 5, o cosseno é:","opcoes":{"a":"3/5","b":"4/5","c":"5/4"}}]},{"id":"seno-cosseno-tangente","activityType":"trig_seno_cosseno_tangente","titulo":"Seno, cosseno e tangente","icone":"chart-no-axes-combined","descricao":"Calcule as razões trigonométricas usando os lados e os ângulos do triângulo retângulo.","questoes":[{"pergunta":"Em um triângulo retângulo, sen(30°) vale:","opcoes":{"a":"1/2","b":"√2/2","c":"√3/2"}},{"pergunta":"cos(60°) vale:","opcoes":{"a":"√3/2","b":"1/2","c":"1"}},{"pergunta":"tg(45°) vale:","opcoes":{"a":"0","b":"1","c":"√3"}},{"pergunta":"Se o cateto oposto mede 6 e o adjacente mede 3, a tangente é:","opcoes":{"a":"2","b":"1/2","c":"3"}},{"pergunta":"Se a hipotenusa mede 10 e o cateto oposto mede 5, o seno é:","opcoes":{"a":"2","b":"1/2","c":"5"}}]},{"id":"ciclo","activityType":"trig_ciclo","titulo":"Ciclo trigonométrico","icone":"circle","descricao":"Localize ângulos no ciclo trigonométrico e compreenda os sinais das razões.","questoes":[{"pergunta":"O ciclo trigonométrico possui raio:","opcoes":{"a":"1","b":"2","c":"π"}},{"pergunta":"No ciclo trigonométrico, 0° corresponde ao ponto:","opcoes":{"a":"(0, 1)","b":"(1, 0)","c":"(−1, 0)"}},{"pergunta":"O ângulo de 90° está localizado:","opcoes":{"a":"No eixo vertical positivo","b":"No eixo horizontal positivo","c":"No eixo horizontal negativo"}},{"pergunta":"No segundo quadrante, o seno é:","opcoes":{"a":"Negativo","b":"Positivo","c":"Sempre zero"}},{"pergunta":"No terceiro quadrante, seno e cosseno são:","opcoes":{"a":"Ambos positivos","b":"Seno positivo e cosseno negativo","c":"Ambos negativos"}}]},{"id":"angulos-notaveis","activityType":"trig_angulos_notaveis","titulo":"Ângulos notáveis","icone":"star","descricao":"Memorize e utilize os valores de seno, cosseno e tangente de 30°, 45° e 60°.","questoes":[{"pergunta":"sen(30°) é:","opcoes":{"a":"1/2","b":"√2/2","c":"√3/2"}},{"pergunta":"sen(45°) é:","opcoes":{"a":"1/2","b":"√2/2","c":"√3/2"}},{"pergunta":"cos(30°) é:","opcoes":{"a":"1/2","b":"√2/2","c":"√3/2"}},{"pergunta":"cos(45°) é:","opcoes":{"a":"1/2","b":"√2/2","c":"√3/2"}},{"pergunta":"tg(60°) é:","opcoes":{"a":"1/√3","b":"1","c":"√3"}}]},{"id":"identidades","activityType":"trig_identidades","titulo":"Identidades trigonométricas","icone":"sigma","descricao":"Use as identidades fundamentais para relacionar seno, cosseno e tangente.","questoes":[{"pergunta":"A identidade fundamental é:","opcoes":{"a":"sen²(x) + cos²(x) = 1","b":"sen(x) + cos(x) = 1","c":"tg²(x) + sen²(x) = 1"}},{"pergunta":"Se sen(x)=3/5 e x é agudo, cos(x) é:","opcoes":{"a":"2/5","b":"4/5","c":"5/4"}},{"pergunta":"A tangente pode ser escrita como:","opcoes":{"a":"sen(x) / cos(x)","b":"cos(x) / sen(x)","c":"sen(x) × cos(x)"}},{"pergunta":"Se sen²(x)=0,36, então cos²(x) é:","opcoes":{"a":"0,36","b":"0,64","c":"1,36"}},{"pergunta":"Se sen(x)=0,6 e cos(x)=0,8, então sen²(x)+cos²(x) é:","opcoes":{"a":"0,8","b":"1","c":"1,4"}}]},{"id":"equacoes","activityType":"trig_equacoes","titulo":"Equações trigonométricas","icone":"function-square","descricao":"Resolva equações trigonométricas simples considerando os valores e os intervalos dos ângulos.","questoes":[{"pergunta":"Se sen(x)=0, com 0° ≤ x < 360°, uma solução é:","opcoes":{"a":"90°","b":"180°","c":"270°"}},{"pergunta":"Se cos(x)=1, com 0° ≤ x < 360°, x é:","opcoes":{"a":"0°","b":"90°","c":"180°"}},{"pergunta":"Se tg(x)=1, com 0° ≤ x < 180°, x é:","opcoes":{"a":"30°","b":"45°","c":"60°"}},{"pergunta":"As soluções de sen(x)=1 no intervalo de 0° a 360° são:","opcoes":{"a":"0°","b":"90°","c":"180°"}},{"pergunta":"cos(x)=0 ocorre em:","opcoes":{"a":"0° e 180°","b":"90° e 270°","c":"45° e 225°"}}]},{"id":"aplicacoes","activityType":"trig_aplicacoes","titulo":"Aplicações da Trigonometria","icone":"mountain","descricao":"Aplique razões trigonométricas para calcular alturas, distâncias e inclinações.","questoes":[{"pergunta":"Para calcular a altura de um prédio usando distância horizontal e ângulo de elevação, uma razão útil é:","opcoes":{"a":"Tangente","b":"Moda","c":"Média"}},{"pergunta":"Uma escada encostada na parede forma um triângulo retângulo. A escada representa:","opcoes":{"a":"Um cateto","b":"A hipotenusa","c":"O ângulo reto"}},{"pergunta":"Uma rampa sobe 1 m a cada 4 m na horizontal. A tangente da inclinação é:","opcoes":{"a":"1/4","b":"4","c":"5"}},{"pergunta":"Se a distância horizontal é 10 m e tg(ângulo)=0,5, a altura é:","opcoes":{"a":"5 m","b":"10 m","c":"20 m"}},{"pergunta":"A Trigonometria é aplicada em:","opcoes":{"a":"Construção, navegação e engenharia","b":"Apenas na contagem de objetos","c":"Somente na classificação de polígonos"}}]}];

    const areaAtividades = document.getElementById("trigonometriaAtividades");
    const mensagemCarregamento = document.getElementById("mensagemCarregamentoTrigonometria");
    const botoesTopicos = document.querySelectorAll(".geometria-topicos button");
    const estados = new Map();
    const tiposAtividade = conteudos.map(function (item) { return item.activityType; });

    let usuarioAtual = null;
    let xpTotal = 0;
    let carregamentoConcluido = false;

    function criarElemento(tag, classe, texto) {
        const elemento = document.createElement(tag);
        if (classe) elemento.className = classe;
        if (texto !== undefined) elemento.textContent = texto;
        return elemento;
    }

    function atualizarXPExibido() {
        estados.forEach(function (estado) { estado.xp.textContent = String(xpTotal); });
    }

    function atualizarPontuacao(estado) {
        estado.pontuacao.textContent = "Pontuação: " + estado.acertos + "/5";
    }

    function bloquearQuestao(questaoElemento, bloquear) {
        questaoElemento.querySelectorAll("button[data-option-id]").forEach(function (botao) {
            botao.disabled = bloquear;
            if (bloquear) botao.classList.add("resposta-bloqueada");
            else botao.classList.remove("resposta-bloqueada");
        });
    }

    function aplicarTentativa(estado, numero, tentativa) {
        if (estado.respondidas.has(numero)) return;
        estado.respondidas.set(numero, tentativa);

        const questaoElemento = estado.painel.querySelector('.questao[data-numero="' + numero + '"]');
        if (!questaoElemento) return;

        bloquearQuestao(questaoElemento, true);
        const botaoSelecionado = questaoElemento.querySelector('[data-option-id="' + tentativa.selected_option_id + '"]');
        if (tentativa.is_correct) estado.acertos++;

        if (botaoSelecionado) {
            botaoSelecionado.classList.add(tentativa.is_correct ? "resposta-correta" : "resposta-errada");
        }
        atualizarPontuacao(estado);
    }

    function verificarConclusao(estado) {
        if (estado.respondidas.size !== 5) return;
        estado.resultado.textContent = estado.acertos === 5
            ? "Parabéns! Você acertou todas as questões deste conteúdo!"
            : "Atividade concluída! Você acertou " + estado.acertos + " de 5 questões.";
    }

    function criarAtividade(conteudo) {
        const painel = criarElemento("section", "exercicios-basico geometria-exercicios");
        painel.hidden = true;

        const cabecalho = criarElemento("div", "titulo-exercicios");
        const icone = document.createElement("i");
        icone.setAttribute("data-lucide", conteudo.icone);
        cabecalho.appendChild(icone);
        cabecalho.appendChild(criarElemento("h2", "", conteudo.titulo));
        painel.appendChild(cabecalho);
        painel.appendChild(criarElemento("p", "subtitulo-exercicios", conteudo.descricao));
        painel.appendChild(criarElemento("p", "geometria-regra-xp", "Responda às 5 questões. Cada acerto vale 10 XP."));

        conteudo.questoes.forEach(function (questao, indice) {
            const numero = indice + 1;
            const blocoQuestao = criarElemento("div", "questao");
            blocoQuestao.dataset.numero = String(numero);

            const enunciado = document.createElement("p");
            enunciado.appendChild(criarElemento("strong", "", numero + "."));
            enunciado.appendChild(document.createTextNode(" " + questao.pergunta));
            blocoQuestao.appendChild(enunciado);

            const alternativas = criarElemento("div", "alternativas");
            Object.entries(questao.opcoes).forEach(function ([letra, texto]) {
                const botao = criarElemento("button", "", texto);
                botao.type = "button";
                botao.dataset.optionId = letra;
                botao.disabled = true;
                botao.addEventListener("click", function () {
                    responderQuestao(conteudo, numero, letra, botao);
                });
                alternativas.appendChild(botao);
            });

            blocoQuestao.appendChild(alternativas);
            painel.appendChild(blocoQuestao);
        });

        const resultado = criarElemento("div", "resultado-exercicios");
        const pontuacao = criarElemento("h2", "", "Pontuação: 0/5");
        const mensagem = criarElemento("p", "");
        mensagem.setAttribute("aria-live", "polite");
        const linhaXP = document.createElement("p");
        linhaXP.appendChild(document.createTextNode("XP total: "));
        const xp = criarElemento("strong", "", "0");
        linhaXP.appendChild(xp);
        resultado.appendChild(pontuacao);
        resultado.appendChild(mensagem);
        resultado.appendChild(linhaXP);
        painel.appendChild(resultado);

        const estado = { painel, pontuacao, resultado: mensagem, xp, respondidas: new Map(), acertos: 0 };
        estados.set(conteudo.activityType, estado);
        areaAtividades.appendChild(painel);
    }

    conteudos.forEach(criarAtividade);

    function selecionarConteudo(id) {
        const selecionado = conteudos.find(function (item) { return item.id === id; });
        if (!selecionado) return;

        botoesTopicos.forEach(function (botao) {
            const ativo = botao.dataset.topico === id;
            botao.classList.toggle("ativo", ativo);
            botao.setAttribute("aria-pressed", String(ativo));
        });

        conteudos.forEach(function (item) {
            estados.get(item.activityType).painel.hidden = item.id !== id;
        });

        mensagemCarregamento.textContent = carregamentoConcluido
            ? "Atividade selecionada. Seu progresso fica salvo."
            : "Carregando seu progresso...";
    }

    botoesTopicos.forEach(function (botao) {
        botao.addEventListener("click", function () { selecionarConteudo(botao.dataset.topico); });
    });

    async function carregarEstadoTrigonometria() {
        try {
            if (!supabaseClient) throw new Error("Conexão com o Supabase indisponível.");

            const { data: { user }, error: erroUsuario } = await supabaseClient.auth.getUser();
            if (erroUsuario || !user) throw new Error("Sessão não autenticada.");
            usuarioAtual = user;

            const [resultadoXP, resultadoTentativas] = await Promise.all([
                supabaseClient.from("user_progress").select("total_xp").eq("user_id", user.id).maybeSingle(),
                supabaseClient.from("user_question_attempts")
                    .select("activity_type, question_id, selected_option_id, is_correct")
                    .eq("user_id", user.id).in("activity_type", tiposAtividade)
            ]);

            if (resultadoXP.error) throw resultadoXP.error;
            if (resultadoTentativas.error) throw resultadoTentativas.error;
            xpTotal = Number(resultadoXP.data?.total_xp || 0);

            (resultadoTentativas.data || []).forEach(function (tentativa) {
                const estado = estados.get(tentativa.activity_type);
                const numero = Number(tentativa.question_id);
                if (!estado || !Number.isInteger(numero) || numero < 1 || numero > 5) return;
                aplicarTentativa(estado, numero, tentativa);
            });

            estados.forEach(function (estado) {
                for (let numero = 1; numero <= 5; numero++) {
                    if (!estado.respondidas.has(numero)) {
                        const questao = estado.painel.querySelector('.questao[data-numero="' + numero + '"]');
                        if (questao) bloquearQuestao(questao, false);
                    }
                }
                if (estado.respondidas.size > 0) estado.resultado.textContent = "Seu progresso anterior foi carregado.";
                verificarConclusao(estado);
            });

            atualizarXPExibido();
            carregamentoConcluido = true;
            mensagemCarregamento.textContent = "Escolha um conteúdo para começar. Seu progresso fica salvo.";
        } catch (erro) {
            console.error("Erro ao carregar atividades de Trigonometria:", erro);
            mensagemCarregamento.textContent = "Não foi possível carregar seu progresso. Atualize a página e tente novamente.";
        }
    }

    async function responderQuestao(conteudo, numero, optionId, botao) {
        const estado = estados.get(conteudo.activityType);
        if (!carregamentoConcluido || !usuarioAtual || !estado || estado.respondidas.has(numero) || !botao || botao.disabled) return;

        const questao = estado.painel.querySelector('.questao[data-numero="' + numero + '"]');
        if (!questao) return;

        bloquearQuestao(questao, true);
        estado.resultado.textContent = "Registrando sua resposta...";

        try {
            const { data, error } = await supabaseClient.rpc("submit_operation_answer", {
                p_activity_type: conteudo.activityType,
                p_question_id: String(numero),
                p_option_id: optionId
            });
            if (error) throw error;
            if (!data) throw new Error("O banco não retornou um resultado.");

            xpTotal = Number(data.total_xp || 0);
            atualizarXPExibido();

            if (data.already_answered) {
                const { data: tentativa, error: erroTentativa } = await supabaseClient
                    .from("user_question_attempts")
                    .select("question_id, selected_option_id, is_correct")
                    .eq("user_id", usuarioAtual.id)
                    .eq("activity_type", conteudo.activityType)
                    .eq("question_id", String(numero))
                    .maybeSingle();
                if (erroTentativa) throw erroTentativa;
                if (tentativa) aplicarTentativa(estado, numero, tentativa);
                estado.resultado.textContent = "Esta questão já foi respondida anteriormente.";
                verificarConclusao(estado);
                return;
            }

            aplicarTentativa(estado, numero, { selected_option_id: optionId, is_correct: data.correct });
            estado.resultado.textContent = data.correct
                ? "Resposta correta! Você ganhou " + data.xp_awarded + " XP."
                : "Resposta incorreta. Continue estudando!";
            verificarConclusao(estado);
        } catch (erro) {
            console.error("Erro ao registrar resposta de Trigonometria:", erro);
            bloquearQuestao(questao, false);
            estado.resultado.textContent = "Não foi possível registrar sua resposta. Tente novamente.";
        }
    }

    carregarEstadoTrigonometria();
    if (window.lucide) lucide.createIcons();
})();
</script>
