<script>
(async function carregarProgressoDasMaterias() {
    const texto = document.getElementById("progressoBasicoTexto");
    const barra = document.getElementById("progressoBasicoBarra");
    const trilho = barra ? barra.parentElement : null;

    if (!texto || !barra || !trilho) return;

    try {
        if (typeof supabaseClient === "undefined" || !supabaseClient ||
            typeof obterUsuarioAutenticado !== "function") {
            throw new Error("Conexão com o banco indisponível.");
        }

        const resultadoUsuario = await obterUsuarioAutenticado();
        const usuario = resultadoUsuario.data && resultadoUsuario.data.user;

        if (resultadoUsuario.error || !usuario) {
            throw resultadoUsuario.error || new Error("Usuário não autenticado.");
        }

        const { data, error } = await supabaseClient
            .from("user_question_rewards")
            .select("activity_type, question_id")
            .in("activity_type", ["adicao", "subtracao", "multiplicacao", "divisao"]);

        if (error) throw error;

        const questoesConcluidas = new Set(
            (data || []).map(function(questao) {
                return questao.activity_type + "-" + questao.question_id;
            })
        );

        // O Básico possui 5 exercícios em cada uma das quatro operações.
        const totalQuestoes = 20;
        const quantidade = Math.min(questoesConcluidas.size, totalQuestoes);
        const porcentagem = Math.round((quantidade / totalQuestoes) * 100);

        barra.style.width = porcentagem + "%";
        trilho.setAttribute("aria-valuenow", String(porcentagem));
        texto.textContent = quantidade + " de " + totalQuestoes +
            " exercícios concluídos • " + porcentagem + "%";
    } catch (erro) {
        console.error("Não foi possível carregar o progresso de Básico da Matemática:", erro);
        texto.textContent = "Progresso indisponível no momento";
    }
})();
</script>
