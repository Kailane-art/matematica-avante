<!DOCTYPE html>
<html lang="pt-BR" class="verificando-sessao">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfil público - Matemática Avante</title>
    <link rel="stylesheet" href="css/style.css?v=20261124-trofeus2">
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
</head>

<body class="pagina-perfil-publico">

<header>
    <button id="voltarPagina" type="button" aria-label="Voltar">
        <i data-lucide="arrow-left"></i>
    </button>

    <h1>Perfil público</h1>

    
</header>

<main class="perfil-container">

    <section class="card-perfil identidade">

        <button id="botaoFavoritoPerfil" class="botao-favorito-perfil" type="button" aria-label="Adicionar aos favoritos" title="Adicionar aos favoritos" hidden>
            <i data-lucide="star"></i>
        </button>
        <button id="botaoInformacaoAdminPerfil" class="botao-informacao-admin-perfil" type="button" aria-label="Informações administrativas" title="Informações administrativas" hidden>
            <i data-lucide="info"></i>
        </button>

        <div class="avatar-area">
            <img id="fotoPerfilPublico" src="" alt="Foto do perfil" hidden>
        </div>

        <h3 id="nomePerfilPublico">Carregando perfil...</h3>

        <p id="usernamePerfilPublico"></p>

        <p id="tipoPerfilPublico"></p>

        <div class="nivel-trofeus-perfil-publico">
            <p id="nivelPerfilPublico" class="nivel-perfil-publico" hidden></p>
            <p id="trofeusPerfilPublico" class="trofeus-perfil-publico" hidden></p>
        </div>

        <p id="seloPerfilPublico" class="selo-perfil-publico" hidden></p>
        <p id="tituloDestaquePerfilPublico" class="item-titulo-conquistado" hidden></p>

        <p id="bioPerfilPublico"></p>

        <p>
            <a id="linkPerfilPublico" href="" target="_blank" rel="noopener noreferrer" hidden>
                Acessar link
            </a>
        </p>

        <div id="acoesPerfilPublico" class="acoes-perfil-publico" hidden>
            <button id="botaoContratarProfessor" type="button" hidden>
                <i data-lucide="briefcase-business"></i>
                Contratar professor
            </button>
            <button id="botaoAdicionarAmizade" type="button">
                <i data-lucide="user-round-plus"></i>
                Adicionar amizade
            </button>
            <button id="botaoEncerrarAmizade" class="botao-encerrar-amizade" type="button" hidden>
                <i data-lucide="user-round-minus"></i>
                Encerrar amizade
            </button>
            <button id="botaoConversarPerfil" class="botao-conversar-perfil" type="button" hidden>
                <i data-lucide="send"></i>
                Conversar
            </button>
            <p id="mensagemAmizadePerfil" role="status" aria-live="polite"></p>
        </div>

        <p id="statusPerfilPublico" role="status" aria-live="polite"></p>

    </section>

    <div id="painelAdministrativoPerfil" class="painel-admin-perfil" hidden>
        <section class="conteudo-painel-admin-perfil" role="dialog" aria-modal="true" aria-labelledby="tituloPainelAdminPerfil">
            <div class="cabecalho-painel-admin-perfil">
                <h2 id="tituloPainelAdminPerfil">Informações administrativas</h2>
                <button id="fecharPainelAdminPerfil" type="button" aria-label="Fechar">×</button>
            </div>
            <p id="estadoAdminPerfil" class="estado-admin-perfil" role="status"></p>
            <div id="acoesAdminPerfil" class="acoes-admin-perfil">
                <button id="botaoSuspenderConta" type="button">Suspender conta</button>
                <button id="botaoBanirConta" type="button">Banir conta</button>
                <button id="botaoRebaixarProfessor" type="button" hidden>Mudar professor para aluno</button>
                <button id="botaoReativarConta" type="button" hidden>Reativar conta</button>
                <button id="botaoRetirarSuspensao" type="button" hidden>Retirar suspensão</button>
                <button id="botaoExcluirConta" type="button">Excluir conta definitivamente</button>
            </div>
            <form id="formExclusaoDefinitivaAdmin" class="form-suspensao-admin form-exclusao-definitiva-admin" hidden>
                <p>Esta ação excluirá permanentemente a conta e os dados associados. Não será possível recuperar o usuário.</p>
                <label for="confirmarUsernameExclusaoAdmin">Digite @<span id="usernameConfirmacaoExclusaoAdmin"></span> para confirmar</label>
                <input id="confirmarUsernameExclusaoAdmin" name="confirmar_username" type="text" autocomplete="off" spellcheck="false" placeholder="@nome de usuário" required>
                <div class="botoes-suspensao-admin">
                    <button id="confirmarExclusaoAdmin" type="submit">Excluir definitivamente</button>
                    <button id="cancelarExclusaoAdmin" type="button">Cancelar</button>
                </div>
            </form>
            <form id="formSuspensaoAdmin" class="form-suspensao-admin" hidden>
                <label for="diasSuspensaoAdmin">Quantidade de dias da suspensão</label>
                <input id="diasSuspensaoAdmin" name="dias" type="number" min="1" max="3650" step="1" inputmode="numeric" placeholder="Ex.: 7" required>
                <div class="botoes-suspensao-admin">
                    <button id="confirmarSuspensaoAdmin" type="submit">Confirmar</button>
                    <button id="cancelarSuspensaoAdmin" type="button">Cancelar</button>
                </div>
            </form>
            <p id="mensagemAdminPerfil" role="status" aria-live="polite"></p>
        </section>
    </div>

</main>

<script src="js/script.js?v=20261125-painel-dev2"></script>
    <script src="js/notificacoes-push.js"></script>

<script>


let perfilPublicoAtual = null;
let usuarioAtualEhDev = false;
let tipoUsuarioAtual = null;

async function configurarBotaoAmizade(idPerfil) {
    const botaoAdicionar = document.getElementById("botaoAdicionarAmizade");
    const botaoEncerrar = document.getElementById("botaoEncerrarAmizade");
    const botaoConversar = document.getElementById("botaoConversarPerfil");
    const mensagem = document.getElementById("mensagemAmizadePerfil");

    if (!botaoAdicionar || !botaoEncerrar || !botaoConversar || !supabaseClient) return;

    botaoAdicionar.hidden = false;
    botaoAdicionar.disabled = true;
    botaoAdicionar.innerHTML = '<i data-lucide="loader-circle"></i> Carregando...';
    botaoEncerrar.hidden = true;
    botaoConversar.hidden = true;
    mensagem.textContent = "";

    try {
        const { data, error } = await supabaseClient.rpc("get_chat_contacts");
        if (error) throw error;

        const relacao = (data || []).find(item => item.contact_id === idPerfil);
        const amizadeAtiva = relacao?.friendship_status === "accepted";
        const podeConversar = amizadeAtiva || usuarioAtualEhDev || perfilPublicoAtual?.tipo_usuario === "dev";

        botaoAdicionar.onclick = null;
        botaoEncerrar.onclick = null;
        botaoConversar.onclick = null;

        if (amizadeAtiva) {
            botaoAdicionar.hidden = true;
            botaoEncerrar.hidden = false;
            botaoEncerrar.disabled = false;
            botaoEncerrar.onclick = async function() {
                const confirmar = window.confirm(
                    "Tem certeza de que deseja encerrar esta amizade? Vocês terão 15 dias para restabelecê-la. Durante esse período, o chat ficará bloqueado."
                );
                if (!confirmar) return;

                botaoEncerrar.disabled = true;
                mensagem.textContent = "Encerrando amizade...";

                const { data: prazo, error: encerramentoErro } = await supabaseClient.rpc(
                    "end_friendship",
                    { p_contact_id: idPerfil }
                );

                if (encerramentoErro) {
                    mensagem.textContent = encerramentoErro.message || "Não foi possível encerrar a amizade.";
                    botaoEncerrar.disabled = false;
                    return;
                }

                await configurarBotaoAmizade(idPerfil);

                const dataLimite = prazo ? new Date(prazo) : null;
                mensagem.textContent = dataLimite
                    ? "Amizade encerrada. Vocês podem restabelecê-la até " +
                      dataLimite.toLocaleString("pt-BR", { dateStyle: "short", timeStyle: "short" }) +
                      ". O histórico será excluído após esse prazo."
                    : "Amizade encerrada. O prazo de recuperação é de 15 dias.";
            };
        } else {
            botaoEncerrar.hidden = true;
            botaoAdicionar.hidden = false;

            if (relacao?.friendship_status === "pending" && relacao.request_direction === "sent") {
                botaoAdicionar.innerHTML = '<i data-lucide="clock-3"></i> Solicitação enviada';
                botaoAdicionar.disabled = true;
            } else if (relacao?.friendship_status === "pending" && relacao.request_direction === "received") {
                botaoAdicionar.innerHTML = '<i data-lucide="user-round-check"></i> Aceitar solicitação';
                botaoAdicionar.disabled = false;
                botaoAdicionar.onclick = async function() {
                    await responderAmizade(relacao.request_id, true);
                };
            } else {
                botaoAdicionar.innerHTML = '<i data-lucide="user-round-plus"></i> Adicionar amizade';
                botaoAdicionar.disabled = false;
                botaoAdicionar.onclick = async function() {
                    botaoAdicionar.disabled = true;
                    mensagem.textContent = "Enviando solicitação...";
                    const { error: envioErro } = await supabaseClient.rpc("send_friend_request", {
                        p_recipient_id: idPerfil
                    });

                    if (envioErro) {
                        mensagem.textContent = envioErro.message || "Não foi possível enviar a solicitação.";
                        botaoAdicionar.disabled = false;
                        return;
                    }

                    await configurarBotaoAmizade(idPerfil);
                    mensagem.textContent = "Solicitação de amizade enviada!";
                    if (window.maPushNotifications) {
                        window.maPushNotifications.enviarEvento("friend_request", { recipient_id: idPerfil });
                    }
                };
            }
        }

        botaoConversar.hidden = !podeConversar;
        if (podeConversar) {
            botaoConversar.disabled = false;
            botaoConversar.onclick = function() {
                const username = perfilPublicoAtual?.username;
                if (!username) {
                    mensagem.textContent = "Não foi possível abrir esta conversa.";
                    return;
                }
                window.location.href = "conversa.html?usuario=" + encodeURIComponent(username);
            };
        }
    } catch (erro) {
        console.error("Erro ao consultar amizade:", erro);
        botaoAdicionar.hidden = false;
        botaoAdicionar.innerHTML = '<i data-lucide="user-round-plus"></i> Adicionar amizade';
        botaoAdicionar.disabled = true;
        botaoEncerrar.hidden = true;
        botaoConversar.hidden = true;
        mensagem.textContent = "Não foi possível carregar o estado da amizade.";
    }

    if (window.lucide) lucide.createIcons();
}

async function responderAmizade(idSolicitacao, aceitar) {
    const botao = document.getElementById("botaoAdicionarAmizade");
    const mensagem = document.getElementById("mensagemAmizadePerfil");
    botao.disabled = true;

    const { error } = await supabaseClient.rpc("respond_friend_request", {
        p_request_id: idSolicitacao,
        p_accept: aceitar
    });

    if (error) {
        mensagem.textContent = error.message || "Não foi possível responder à solicitação.";
        botao.disabled = false;
        return;
    }

    if (window.maPushNotifications) {
        await window.maPushNotifications.enviarEvento("friend_response", { request_id: idSolicitacao });
    }
    await carregarEstadoAmizadeAtual();
    mensagem.textContent = aceitar ? "Agora vocês são amigos!" : "Solicitação recusada.";
}

async function carregarEstadoAmizadeAtual() {
    const nomeUsuario = new URLSearchParams(window.location.search).get("usuario");
    const { data, error } = await supabaseClient.rpc("get_public_profile", { p_username: nomeUsuario });
    if (error) return;
    const perfil = Array.isArray(data) ? data[0] : data;
    if (perfil) {
        perfilPublicoAtual = perfil;
        await configurarBotaoAmizade(perfil.id);
    }
}

function atualizarBotaoFavorito(favoritado) {
    const botao = document.getElementById("botaoFavoritoPerfil");
    if (!botao) return;

    botao.dataset.favoritado = String(favoritado);
    botao.classList.toggle("favoritado", favoritado);
    botao.setAttribute(
        "aria-label",
        favoritado ? "Remover dos favoritos" : "Adicionar aos favoritos"
    );
    botao.title = favoritado ? "Remover dos favoritos" : "Adicionar aos favoritos";
    botao.innerHTML = '<i data-lucide="star"></i>';
    botao.disabled = false;

    if (window.lucide) lucide.createIcons();
}

async function configurarFavoritoPerfil(idPerfil, idUsuarioAtual, ehProprioPerfil) {
    const botao = document.getElementById("botaoFavoritoPerfil");
    const status = document.getElementById("statusPerfilPublico");
    if (!botao) return;

    if (!idUsuarioAtual || ehProprioPerfil) {
        botao.hidden = true;
        return;
    }

    botao.hidden = false;
    botao.disabled = true;

    try {
        const { data, error } = await supabaseClient
            .from("profile_favorites")
            .select("profile_id")
            .eq("user_id", idUsuarioAtual)
            .eq("profile_id", idPerfil)
            .maybeSingle();

        if (error) throw error;

        atualizarBotaoFavorito(Boolean(data));

        botao.onclick = async function() {
            if (botao.disabled) return;
            botao.disabled = true;
            const jaFavoritado = botao.dataset.favoritado === "true";

            try {
                let resultado;

                if (jaFavoritado) {
                    resultado = await supabaseClient
                        .from("profile_favorites")
                        .delete()
                        .eq("user_id", idUsuarioAtual)
                        .eq("profile_id", idPerfil);
                } else {
                    resultado = await supabaseClient
                        .from("profile_favorites")
                        .insert({
                            user_id: idUsuarioAtual,
                            profile_id: idPerfil
                        });
                }

                if (resultado.error) throw resultado.error;
                atualizarBotaoFavorito(!jaFavoritado);
                status.textContent = jaFavoritado
                    ? "Perfil removido dos favoritos."
                    : "Perfil salvo nos favoritos.";
            } catch (erro) {
                console.error("Erro ao atualizar favorito:", erro);
                status.textContent = "Não foi possível atualizar os favoritos. Tente novamente.";
                botao.disabled = false;
            }
        };
    } catch (erro) {
        console.error("Erro ao carregar favorito:", erro);
        botao.hidden = true;
        status.textContent = "Não foi possível carregar os favoritos.";
    }
}


async function executarAcaoAdministrativaPerfil(action, extras = {}) {
    const { data, error } = await supabaseClient.functions.invoke("account-admin", {
        body: {
            action,
            target_user_id: perfilPublicoAtual?.id,
            ...extras
        }
    });
    if (error) throw error;
    if (data?.error) throw new Error(data.error);
    return data;
}

async function configurarPainelAdministrativoPerfil(ehProprioPerfil, idUsuarioAtual) {
    const botao = document.getElementById("botaoInformacaoAdminPerfil");
    const painel = document.getElementById("painelAdministrativoPerfil");
    const estado = document.getElementById("estadoAdminPerfil");
    const mensagem = document.getElementById("mensagemAdminPerfil");
    const formSuspensao = document.getElementById("formSuspensaoAdmin");
    const campoDias = document.getElementById("diasSuspensaoAdmin");
    const botaoRebaixar = document.getElementById("botaoRebaixarProfessor");
    const botaoReativar = document.getElementById("botaoReativarConta");
    const botaoRetirarSuspensao = document.getElementById("botaoRetirarSuspensao");
    const botaoSuspender = document.getElementById("botaoSuspenderConta");
    const botaoBanir = document.getElementById("botaoBanirConta");
    const botaoExcluir = document.getElementById("botaoExcluirConta");
    const formExclusao = document.getElementById("formExclusaoDefinitivaAdmin");
    const campoConfirmacaoExclusao = document.getElementById("confirmarUsernameExclusaoAdmin");
    const botaoConfirmarExclusao = document.getElementById("confirmarExclusaoAdmin");
    const botaoCancelarExclusao = document.getElementById("cancelarExclusaoAdmin");

    if (!botao || !painel || !usuarioAtualEhDev || ehProprioPerfil || !perfilPublicoAtual?.id) {
        if (botao) botao.hidden = true;
        return;
    }

    botao.hidden = false;
    const alvoEhDev = perfilPublicoAtual.tipo_usuario === "dev";
    const usuarioAtualEhDevPrincipal = idUsuarioAtual === "356e82f3-2ad0-4932-bc2c-e328bc7066d2";
    const podeGerenciarRestricaoDoAlvo = !alvoEhDev || usuarioAtualEhDevPrincipal;
    botaoSuspender.hidden = !podeGerenciarRestricaoDoAlvo;
    botaoBanir.hidden = !podeGerenciarRestricaoDoAlvo;
    botaoReativar.hidden = !podeGerenciarRestricaoDoAlvo;
    botaoRetirarSuspensao.hidden = !podeGerenciarRestricaoDoAlvo;
    botaoRebaixar.hidden = perfilPublicoAtual.tipo_usuario !== "professor";
    botaoExcluir.hidden = !usuarioAtualEhDevPrincipal;
    mensagem.textContent = "";
    estado.textContent = "Verificando situação da conta...";

    try {
        const resultado = await executarAcaoAdministrativaPerfil("status");
        const restricao = resultado.restriction;
        if (restricao?.restriction_type === "pending_deletion") {
            estado.textContent = "Conta banida. Prazo para reativação até " +
                new Date(restricao.expires_at).toLocaleString("pt-BR");
            botaoSuspender.hidden = true;
            botaoBanir.hidden = true;
            botaoRebaixar.hidden = true;
            botaoReativar.hidden = false;
            botaoRetirarSuspensao.hidden = true;
        } else if (restricao?.restriction_type === "temporary_suspension") {
            estado.textContent = "Conta suspensa por " + restricao.duration_days + " dia(s), até " +
                new Date(restricao.expires_at).toLocaleString("pt-BR");
            botaoSuspender.hidden = true;
            botaoBanir.hidden = false;
            botaoReativar.hidden = true;
            botaoRetirarSuspensao.hidden = false;
        } else {
            estado.textContent = "Nenhuma restrição administrativa ativa.";
            botaoSuspender.hidden = false;
            botaoBanir.hidden = false;
            botaoReativar.hidden = true;
            botaoRetirarSuspensao.hidden = true;
        }
    } catch (erro) {
        console.error("Erro ao consultar situação administrativa:", erro);
        estado.textContent = "Não foi possível consultar a situação da conta. As ações administrativas continuam disponíveis.";
        botaoSuspender.hidden = false;
        botaoBanir.hidden = false;
        botaoReativar.hidden = true;
        botaoRetirarSuspensao.hidden = true;
        botaoRebaixar.hidden = perfilPublicoAtual.tipo_usuario !== "professor";
    }

    if (!podeGerenciarRestricaoDoAlvo) {
        botaoSuspender.hidden = true;
        botaoBanir.hidden = true;
        botaoReativar.hidden = true;
        botaoRetirarSuspensao.hidden = true;
        formSuspensao.hidden = true;
    }

    botao.onclick = function() {
        painel.hidden = false;
        formSuspensao.hidden = true;
        formExclusao.hidden = true;
        campoConfirmacaoExclusao.value = "";
        mensagem.textContent = "";
    };

    document.getElementById("fecharPainelAdminPerfil").onclick = function() {
        painel.hidden = true;
    };

    document.getElementById("cancelarSuspensaoAdmin").onclick = function() {
        formSuspensao.hidden = true;
        campoDias.value = "";
        mensagem.textContent = "";
    };

    botaoSuspender.onclick = function() {
        formSuspensao.hidden = false;
        campoDias.value = "";
        campoDias.focus();
        mensagem.textContent = "";
    };

    document.getElementById("usernameConfirmacaoExclusaoAdmin").textContent = perfilPublicoAtual.username;

    botaoExcluir.onclick = function() {
        formSuspensao.hidden = true;
        formExclusao.hidden = false;
        campoConfirmacaoExclusao.value = "";
        mensagem.textContent = "A exclusão será permanente. Confira o nome de usuário antes de confirmar.";
        campoConfirmacaoExclusao.focus();
    };

    botaoCancelarExclusao.onclick = function() {
        formExclusao.hidden = true;
        campoConfirmacaoExclusao.value = "";
        mensagem.textContent = "";
    };

    formExclusao.onsubmit = async function(evento) {
        evento.preventDefault();
        const nomeDigitado = campoConfirmacaoExclusao.value.trim().replace(/^@/, "");
        if (nomeDigitado.toLowerCase() !== String(perfilPublicoAtual.username || "").toLowerCase()) {
            mensagem.textContent = "O nome de usuário digitado não corresponde ao perfil selecionado.";
            campoConfirmacaoExclusao.focus();
            return;
        }

        const confirmar = window.confirm(
            "ATENÇÃO: a conta @" + perfilPublicoAtual.username +
            " e seus dados associados serão excluídos definitivamente. Esta ação não pode ser desfeita. Continuar?"
        );
        if (!confirmar) return;

        botaoConfirmarExclusao.disabled = true;
        botaoExcluir.disabled = true;
        mensagem.textContent = "Excluindo conta e removendo os arquivos associados...";

        try {
            await executarAcaoAdministrativaPerfil("delete", {
                confirm_username: campoConfirmacaoExclusao.value.trim()
            });
            painel.hidden = true;
            window.alert("A conta @" + perfilPublicoAtual.username + " foi excluída definitivamente.");
            window.location.replace("inicio.html");
        } catch (erro) {
            mensagem.textContent = erro.message || "Não foi possível excluir a conta.";
            botaoConfirmarExclusao.disabled = false;
            botaoExcluir.disabled = false;
        }
    };

    formSuspensao.onsubmit = async function(evento) {
        evento.preventDefault();
        const dias = Number(campoDias.value);
        if (!Number.isSafeInteger(dias) || dias < 1 || dias > 3650) {
            mensagem.textContent = "Informe um número inteiro entre 1 e 3650 dias.";
            return;
        }
        const confirmar = window.confirm("Confirmar suspensão desta conta por " + dias + " dia(s)?");
        if (!confirmar) return;
        const confirmarBotao = document.getElementById("confirmarSuspensaoAdmin");
        confirmarBotao.disabled = true;
        mensagem.textContent = "Aplicando suspensão...";
        try {
            const resultado = await executarAcaoAdministrativaPerfil("suspend", { days: dias });
            estado.textContent = "Conta suspensa até " + new Date(resultado.expires_at).toLocaleString("pt-BR");
            mensagem.textContent = "Suspensão aplicada.";
            formSuspensao.hidden = true;
            botaoSuspender.hidden = true;
            botaoBanir.hidden = false;
            botaoReativar.hidden = true;
            botaoRetirarSuspensao.hidden = false;
            campoDias.value = "";
        } catch (erro) {
            mensagem.textContent = erro.message || "Não foi possível suspender a conta.";
        } finally {
            confirmarBotao.disabled = false;
        }
    };

    botaoBanir.onclick = async function() {
        if (!window.confirm("Banir esta conta? Ela ficará bloqueada e poderá ser reativada por uma conta DEV durante 30 dias. Depois disso, será excluída definitivamente e o e-mail ficará bloqueado permanentemente.")) return;
        botaoBanir.disabled = true;
        mensagem.textContent = "Banindo conta...";
        try {
            const resultado = await executarAcaoAdministrativaPerfil("ban");
            estado.textContent = "Conta banida. Prazo para reativação até " +
                new Date(resultado.expires_at).toLocaleString("pt-BR");
            mensagem.textContent = "Conta banida e prazo de recuperação iniciado.";
            botaoSuspender.hidden = true;
            botaoBanir.hidden = true;
            botaoRebaixar.hidden = true;
            botaoReativar.hidden = false;
        } catch (erro) {
            mensagem.textContent = erro.message || "Não foi possível banir a conta.";
        } finally {
            botaoBanir.disabled = false;
        }
    };

    botaoRetirarSuspensao.onclick = async function() {
        if (!window.confirm("Retirar a suspensão desta conta e liberar o login imediatamente?")) return;
        botaoRetirarSuspensao.disabled = true;
        mensagem.textContent = "Retirando suspensão...";
        try {
            await executarAcaoAdministrativaPerfil("unsuspend");
            estado.textContent = "Nenhuma restrição administrativa ativa.";
            mensagem.textContent = "Suspensão retirada. O usuário já pode fazer login.";
            botaoSuspender.hidden = false;
            botaoBanir.hidden = false;
            botaoRetirarSuspensao.hidden = true;
        } catch (erro) {
            mensagem.textContent = erro.message || "Não foi possível retirar a suspensão.";
        } finally {
            botaoRetirarSuspensao.disabled = false;
        }
    };

    botaoRebaixar.onclick = async function() {
        if (perfilPublicoAtual?.tipo_usuario !== "professor") return;
        if (!window.confirm("Mudar esta conta de professor para aluno?")) return;
        botaoRebaixar.disabled = true;
        mensagem.textContent = "Atualizando tipo de conta...";
        try {
            await executarAcaoAdministrativaPerfil("demote");
            perfilPublicoAtual.tipo_usuario = "aluno";
            document.getElementById("tipoPerfilPublico").textContent = "Aluno";
            botaoRebaixar.hidden = true;
            mensagem.textContent = "A conta agora é do tipo aluno.";
        } catch (erro) {
            mensagem.textContent = erro.message || "Não foi possível alterar o tipo da conta.";
        } finally {
            botaoRebaixar.disabled = false;
        }
    };

    botaoReativar.onclick = async function() {
        if (!window.confirm("Reativar esta conta?")) return;
        botaoReativar.disabled = true;
        mensagem.textContent = "Reativando conta...";
        try {
            await executarAcaoAdministrativaPerfil("restore");
            estado.textContent = "Conta reativada. Nenhuma restrição administrativa ativa.";
            mensagem.textContent = "Conta reativada com sucesso.";
            botaoSuspender.hidden = false;
            botaoBanir.hidden = false;
            botaoReativar.hidden = true;
            botaoRetirarSuspensao.hidden = true;
            botaoRebaixar.hidden = perfilPublicoAtual.tipo_usuario !== "professor";
        } catch (erro) {
            mensagem.textContent = erro.message || "Não foi possível reativar a conta.";
        } finally {
            botaoReativar.disabled = false;
        }
    };

    painel.addEventListener("click", function(evento) {
        if (evento.target === painel) painel.hidden = true;
    });
}

async function atualizarTrofeusPerfilPublico(nomeUsuario) {
    const elementoTrofeus = document.getElementById("trofeusPerfilPublico");
    if (!elementoTrofeus) return;

    try {
        const { data: quantidadeTrofeus, error: erroTrofeus } = await supabaseClient.rpc(
            "get_public_profile_trophies",
            { p_username: nomeUsuario }
        );

        if (erroTrofeus) throw erroTrofeus;

        const totalTrofeus = Number(quantidadeTrofeus) || 0;
        elementoTrofeus.textContent = totalTrofeus > 0
            ? "🏆 Troféus: " + totalTrofeus
            : "";
        elementoTrofeus.hidden = totalTrofeus <= 0;
    } catch (erro) {
        console.warn("Não foi possível carregar os troféus do perfil:", erro);
    }
}

async function carregarPerfilPublico() {

    const status = document.getElementById("statusPerfilPublico");
    const nome = document.getElementById("nomePerfilPublico");
    const username = document.getElementById("usernamePerfilPublico");
    const tipo = document.getElementById("tipoPerfilPublico");
    const bio = document.getElementById("bioPerfilPublico");
    const link = document.getElementById("linkPerfilPublico");
    const foto = document.getElementById("fotoPerfilPublico");

    const parametros = new URLSearchParams(window.location.search);
    const nomeUsuario = (parametros.get("usuario") || "").trim();

    if (!/^[a-zA-Z0-9_]{3,20}$/.test(nomeUsuario)) {
        nome.textContent = "Perfil não encontrado";
        status.textContent = "O endereço do perfil é inválido.";
        return;
    }

    try {

        const { data, error } = await supabaseClient.rpc(
            "get_public_profile",
            { p_username: nomeUsuario }
        );

        if (error) {
            throw error;
        }

        const perfil = Array.isArray(data) ? data[0] : data;

        if (!perfil) {
            nome.textContent = "Perfil não encontrado";
            status.textContent = "Esse usuário não existe ou o perfil não está disponível.";
            return;
        }

        nome.textContent = perfil.display_name || "Usuário";

        const { data: sessaoAtual } = await supabaseClient.auth.getUser();
        const ehProprioPerfil = sessaoAtual?.user?.id === perfil.id;
        perfilPublicoAtual = perfil;
        usuarioAtualEhDev = false;
        tipoUsuarioAtual = null;

        if (sessaoAtual?.user?.id) {
            const { data: perfilLogado, error: erroPerfilLogado } = await supabaseClient
                .from("profiles")
                .select("tipo_usuario")
                .eq("id", sessaoAtual.user.id)
                .maybeSingle();
            if (erroPerfilLogado) throw erroPerfilLogado;
            tipoUsuarioAtual = perfilLogado?.tipo_usuario || null;
            usuarioAtualEhDev = tipoUsuarioAtual === "dev";
        }

        const botaoContratar = document.getElementById("botaoContratarProfessor");
        if (botaoContratar) {
            botaoContratar.hidden = !(
                perfil.tipo_usuario === "professor" &&
                tipoUsuarioAtual !== null &&
                tipoUsuarioAtual !== "professor"
            );
        }

        const acoesPerfil = document.getElementById("acoesPerfilPublico");

        if (acoesPerfil && !ehProprioPerfil && sessaoAtual?.user) {
            acoesPerfil.hidden = false;
            await configurarBotaoAmizade(perfil.id);
        }
        username.textContent = "@" + perfil.username;
        tipo.textContent =
            perfil.tipo_usuario === "professor"
                ? "Professor"
                : perfil.tipo_usuario === "dev"
                    ? "DEV"
                    : "Aluno";

        const nivel = document.getElementById("nivelPerfilPublico");
        try {
            const { data: nivelAtual, error: erroNivel } = await supabaseClient.rpc(
                "get_public_profile_level",
                { p_username: nomeUsuario }
            );
            if (erroNivel) throw erroNivel;
            if (Number.isInteger(nivelAtual)) {
                nivel.textContent = "Nível " + nivelAtual;
                nivel.hidden = false;
            }
        } catch (erro) {
            console.warn("Não foi possível carregar o nível público:", erro);
        }

        const selo = document.getElementById("seloPerfilPublico");
        selo.classList.remove("selo-dev-nome");
        selo.removeAttribute("title");

        if (perfil.tipo_usuario === "dev") {
            selo.textContent = "⚡ Selo: Coração da Matrix";
            selo.classList.add("selo-dev-nome");
            selo.hidden = false;
        } else {
            selo.textContent = "";
            selo.hidden = true;
        }

        const elementoTitulo = document.getElementById("tituloDestaquePerfilPublico");
        const titulosDisponiveis = window.MA_TITULOS_CONQUISTAS || {};
        const tituloSelecionado = titulosDisponiveis[perfil.featured_title] || null;

        elementoTitulo.classList.remove(
            "raridade-comum",
            "raridade-raro",
            "raridade-epico",
            "raridade-lendario",
            "raridade-mitico"
        );
        elementoTitulo.removeAttribute("title");

        if (tituloSelecionado) {
            elementoTitulo.textContent = "Título: " + tituloSelecionado.nome;
            elementoTitulo.classList.add("raridade-" + tituloSelecionado.raridade);
            elementoTitulo.title = "Classificação: " + tituloSelecionado.classificacao;
            elementoTitulo.hidden = false;
        } else {
            elementoTitulo.textContent = "";
            elementoTitulo.hidden = true;
        }

        await atualizarTrofeusPerfilPublico(nomeUsuario);
        setInterval(function() {
            atualizarTrofeusPerfilPublico(nomeUsuario);
        }, 30000);

        await configurarFavoritoPerfil(perfil.id, sessaoAtual?.user?.id, ehProprioPerfil);
        await configurarPainelAdministrativoPerfil(ehProprioPerfil, sessaoAtual?.user?.id);
        bio.textContent = perfil.bio || "Este usuário ainda não adicionou uma bio.";

        if (perfil.avatar_path) {

            const { data: imagem } = supabaseClient
                .storage
                .from("avatars")
                .getPublicUrl(perfil.avatar_path);

            foto.onload = function() {
                foto.hidden = false;
                foto.parentElement.classList.add("com-foto");
            };

            foto.onerror = function() {
                foto.hidden = true;
                foto.parentElement.classList.remove("com-foto");
            };

            foto.src = imagem.publicUrl + "?v=" + Date.now();

        }

        if (
            perfil.link &&
            /^https?:\/\/.+/i.test(perfil.link)
        ) {

            link.href = perfil.link;
            link.textContent = perfil.link;
            link.hidden = false;

        }

        status.textContent = "";

    } catch (erro) {

        console.error("Erro ao carregar perfil público:", erro);
        nome.textContent = "Não foi possível carregar o perfil";
        status.textContent = "Verifique sua conexão e tente novamente.";

    }

}

carregarPerfilPublico();

if (window.lucide) {
    lucide.createIcons();
}

</script>
